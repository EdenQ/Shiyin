<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>定例会議（文字起こし）</title><style>
body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, sans-serif; font-size: 12pt; line-height: 1.6; color: #1E2625; }
h1, h2, h3 { font-family: "Hiragino Mincho ProN", serif; font-weight: 600; }
h1 { font-size: 22pt; margin-bottom: 4pt; } h2 { font-size: 15pt; margin-top: 18pt; } h3 { font-size: 13pt; }
.meta { color: #68726F; font-size: 10pt; }
.time { color: #2D6A5D; font-size: 9.5pt; }
table { border-collapse: collapse; width: 100%; } th, td { border-bottom: 1px solid #DCE1DE; padding: 4pt 6pt; text-align: left; vertical-align: top; }
th { color: #68726F; font-weight: normal; font-size: 10pt; }
.nowrap { white-space: nowrap; }  /* 負責人、期限不拆行，內容欄自己換行（中日文可以在任何字之間換行，表格會把短欄擠到一個字寬） */
</style></head><body><h1>定例会議（文字起こし）</h1>
<p class="meta">2026-10-19</p>
<p><b>話者 1</b>：皆さん、おはようございます。</p>
<p><b>話者 2</b>：新しいアイデアを三つ出します。</p>
<p><b>話者 1</b>：ありがとうございます、田中さん。</p></body></html>
