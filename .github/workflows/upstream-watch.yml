# 上游監看（fork design §F0.5；PLAN-fork-5.0 §8.2、階段 3b）：每天機械式比對上游的新東西。
# 報告只放這次執行的 artifact（使用者決定：不建立 Issue、不留言、不推送）；job summary 只寫一行。
# 權限只有 contents: read，不用任何 secret。第三方 action 鎖在 commit SHA。
name: upstream-watch

on:
  schedule:
    - cron: '17 1 * * *'   # 每天 01:17 UTC（台灣 09:17）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream (tags into refs/upstream-tags/*)
        run: |
          set -euo pipefail
          # 上游的 tag 放 refs/upstream-tags/*，不碰 refs/tags（fork 自己的 tag）；不設 remote，只用參數
          git fetch --no-tags --prune https://github.com/juinwei7/Shiyin.git \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/tags/*:refs/upstream-tags/*'

      - name: Restore last state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .upstream-watch/state.json
          key: upstream-watch-state-${{ github.run_id }}
          restore-keys: |
            upstream-watch-state-

      - name: Compare
        id: watch
        run: |
          set +e
          mkdir -p .upstream-watch out
          python3 scripts/fork/upstream-watch.py --fork HEAD --head upstream/main \
            --state .upstream-watch/state.json --update-state \
            --out-md out/upstream-watch.md --out-json out/upstream-watch.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "沒有新東西" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "有新東西，見 artifact" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "工具錯誤，見 artifact" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .upstream-watch/state.json
          key: upstream-watch-state-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: upstream-watch-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
